<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 377" width="860" height="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="376" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">VoxHOD roadmap</text><text x="20" y="49" font-size="12" fill="#94928b">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#2c2c2a"/><text x="20" y="130" font-size="15" font-weight="700" fill="#ffffff">VoxHOD</text><rect x="122" y="116" width="233" height="103" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="116" width="4" height="103" rx="2" fill="#d95926"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#ffffff">A larger validation split</text><rect x="130" y="149" width="217" height="68" rx="4" fill="#232321"/><text x="134" y="164" font-size="11.5" fill="#c3c2b7">Matched on 317 validation people,</text><text x="134" y="179" font-size="11.5" fill="#c3c2b7">models still land between 77% and</text><text x="134" y="194" font-size="11.5" fill="#c3c2b7">87% test recall; fix this before</text><text x="134" y="209" font-size="11.5" fill="#c3c2b7">more comparisons</text><rect x="122" y="227" width="233" height="118" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="134" y="249" font-size="12.5" font-weight="600" fill="#ffffff">Fewer false alarms, same recall</text><rect x="130" y="260" width="217" height="83" rx="4" fill="#232321"/><text x="134" y="275" font-size="11.5" fill="#c3c2b7">Tried 2026-11-08/09: hard</text><text x="134" y="290" font-size="11.5" fill="#c3c2b7">negatives, 1.5x weight, extra</text><text x="134" y="305" font-size="11.5" fill="#c3c2b7">training, pruning and a QAT nano</text><text x="134" y="320" font-size="11.5" fill="#c3c2b7">all slid along the same</text><text x="134" y="335" font-size="11.5" fill="#c3c2b7">trade-off. Next: a larger teacher</text><rect x="365" y="116" width="233" height="88" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#ffffff">More varied empty terrain</text><rect x="373" y="149" width="217" height="53" rx="4" fill="#232321"/><text x="377" y="164" font-size="11.5" fill="#c3c2b7">NOMAD: 1.3 false alarms per empty</text><text x="377" y="179" font-size="11.5" fill="#c3c2b7">tile, 4x HERIDAL. Gate: fewer on</text><text x="377" y="194" font-size="11.5" fill="#c3c2b7">NOMAD, same recall</text><rect x="365" y="212" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="234" font-size="12.5" font-weight="600" fill="#ffffff">Find small people more often</text><rect x="373" y="245" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="260" font-size="11.5" fill="#c3c2b7">Gate: ≥ 85% of 8-16 px people,</text><text x="377" y="275" font-size="11.5" fill="#c3c2b7">same file size</text><rect x="607" y="116" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#ffffff">More varied aerial data (full</text><text x="619" y="155" font-size="12.5" font-weight="600" fill="#ffffff">WiSARD, SeaDronesSee)</text><rect x="615" y="166" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="181" font-size="11.5" fill="#c3c2b7">Gate: WiSARD recall &gt; 61.3%</text><text x="619" y="196" font-size="11.5" fill="#c3c2b7">without losing HERIDAL</text><rect x="607" y="214" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="236" font-size="12.5" font-weight="600" fill="#ffffff">Measure on an ESP32-S3</text><rect x="615" y="247" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="262" font-size="11.5" fill="#c3c2b7">P4 checked 2026-11-09: same</text><text x="619" y="277" font-size="11.5" fill="#c3c2b7">recall as the PC on 163 tiles</text></svg>