<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 336" width="860" height="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="859" height="335" rx="6" fill="#1a1a19" stroke="#2c2c2a"/><text x="20" y="30" font-size="15" font-weight="600" fill="#ffffff">VoxHOD roadmap</text><text x="20" y="49" font-size="12" fill="#94928b">Rule: the device model never grows; larger models are only teachers. A step ships only if it passes its gate.</text><text x="122" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">NEXT</text><text x="365" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">THIS WEEK</text><text x="607" y="100" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#94928b">LATER</text><line x1="20" x2="840" y1="108" y2="108" stroke="#2c2c2a"/><text x="20" y="130" font-size="15" font-weight="700" fill="#ffffff">VoxHOD</text><rect x="122" y="116" width="233" height="135" rx="7" fill="#1a1a19" stroke="#d95926" stroke-width="1.6"/><rect x="122" y="116" width="4" height="135" rx="2" fill="#d95926"/><text x="134" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Hard negatives, tuned for</text><text x="134" y="155" font-size="12.5" font-weight="600" fill="#ffffff">recall</text><rect x="130" y="166" width="217" height="83" rx="4" fill="#232321"/><text x="134" y="181" font-size="11.5" fill="#c3c2b7">Tried 2026-11-08: false alarms</text><text x="134" y="196" font-size="11.5" fill="#c3c2b7">halved, but recall fell to 79%;</text><text x="134" y="211" font-size="11.5" fill="#c3c2b7">gate not passed. Next: fewer hard</text><text x="134" y="226" font-size="11.5" fill="#c3c2b7">negatives or a recall-weighted</text><text x="134" y="241" font-size="11.5" fill="#c3c2b7">loss</text><rect x="365" y="116" width="233" height="73" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="377" y="138" font-size="12.5" font-weight="600" fill="#ffffff">Find small people more often</text><rect x="373" y="149" width="217" height="38" rx="4" fill="#232321"/><text x="377" y="164" font-size="11.5" fill="#c3c2b7">Gate: ≥ 85% of 8-16 px people,</text><text x="377" y="179" font-size="11.5" fill="#c3c2b7">same file size</text><rect x="607" y="116" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="138" font-size="12.5" font-weight="600" fill="#ffffff">More varied aerial data (full</text><text x="619" y="155" font-size="12.5" font-weight="600" fill="#ffffff">WiSARD, SeaDronesSee)</text><rect x="615" y="166" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="181" font-size="11.5" fill="#c3c2b7">Gate: WiSARD recall &gt; 61.3%</text><text x="619" y="196" font-size="11.5" fill="#c3c2b7">without losing HERIDAL</text><rect x="607" y="214" width="233" height="90" rx="7" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/><text x="619" y="236" font-size="12.5" font-weight="600" fill="#ffffff">Check device output against the</text><text x="619" y="253" font-size="12.5" font-weight="600" fill="#ffffff">PC, measure on an ESP32-S3</text><rect x="615" y="264" width="217" height="38" rx="4" fill="#232321"/><text x="619" y="279" font-size="11.5" fill="#c3c2b7">Gate: same detections on device</text><text x="619" y="294" font-size="11.5" fill="#c3c2b7">and PC</text></svg>